name: Verify

# The data-safety checks are why this exists: a commit that reintroduces a way
# to erase the store owner's products must fail here, before it reaches
# production. tests/catalogue.test.ts exercises the real storage code against
# a stub Blob HTTP server, so the insert-only/soft-delete/audit guarantees are
# verified against actual read-modify-write behaviour, not just source-code
# pattern checks.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (data-safety guardrails included)
        run: npm run test
      - name: Build
        run: npm run build
