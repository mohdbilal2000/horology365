name: Verify

# The data-safety tests are why this exists: a commit that reintroduces a way to
# erase the store owner's products must fail here, before it can reach
# production. See tests/data-safety.test.ts.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Data-safety guardrails
        run: npm run test
      - name: Build
        run: npm run build
